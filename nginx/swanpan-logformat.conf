# Visitor IP first (real_ip rewrites $remote_addr from CF-Connecting-IP),
# then the usual combined fields. CF-IPCountry is a 2-letter code Cloudflare
# adds for free -- geo without shipping a GeoIP database.
log_format swanpan '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $cf_ipcountry';
